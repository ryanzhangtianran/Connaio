version: '3'

vars:
  APP_NAME: "connaio" # executable name
  BUNDLE_NAME: "Connaio" # the .app shown in Finder
  BIN_DIR: "bin"
  # connaio-core checkout, built into the app bundle next to the GUI binary
  CORE_DIR: '{{.CORE_DIR | default "../connaio-core"}}'
  # the app's version is its latest git tag
  VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' | grep . || echo 0.0.0
  # the version less a test build's suffix (1.0.0 of 1.0.0-rc.1): Windows' version fields take numbers only
  VERSION_NUM: '{{splitList "-" .VERSION | first}}'
  # the mihomo release connaio-core is based on (common:build:core adds its commit on macOS): a v tag,
  # not upstream's moving Prerelease-Alpha, which a merge can bring nearer
  CORE_VERSION:
    sh: git -C "{{.CORE_DIR}}" describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' | grep . || echo unknown
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

env:
  # modules and go-installed tools under the repo, not ~/go
  GOPATH: '{{.ROOT_DIR}}/.go'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
