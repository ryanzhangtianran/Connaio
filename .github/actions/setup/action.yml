# What every build job sets up after checking Connaio out to Connaio/: connaio-core next to it,
# Go, Node and wails3 (wails3 task builds connaio-core from ../connaio-core).
name: setup
description: Check out connaio-core and install Go, Node and wails3

inputs:
  wails-tags:
    description: build tags for wails3 itself (gtk3 on Ubuntu 22.04, whose GUI stack it links)
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ryanzhangtianran/connaio-core
        ref: reverse-tunnels
        path: connaio-core
        fetch-depth: 0 # its latest tag is the mihomo version it reports
    - uses: actions/setup-go@v5
      with:
        go-version-file: Connaio/go.mod
        cache: false # below: saved on main only, as a tag's cache serves no other tag
    - id: go
      shell: bash
      run: |
        # the Taskfile's GOPATH (Connaio/.go) would download the modules outside the cache
        echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
        echo "key=go-${{ runner.os }}-${{ runner.arch }}-$(go env GOVERSION)-${{ hashFiles('Connaio/go.sum', 'connaio-core/go.sum') }}" >> "$GITHUB_OUTPUT"
        printf 'paths<<EOF\n%s\n%s\nEOF\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@v4
      with:
        path: ${{ steps.go.outputs.paths }}
        key: ${{ steps.go.outputs.key }}
    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.go.outputs.paths }}
        key: ${{ steps.go.outputs.key }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install wails3
      shell: bash
      run: |
        go install -tags "${{ inputs.wails-tags }}" github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
