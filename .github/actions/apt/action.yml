# Installs Ubuntu packages with their downloads cached between runs: the Ubuntu mirror now and then
# takes the install from 25 s to 20 min. A cache hit installs the cached .debs with dpkg and never
# asks the mirror; dpkg still records them, so a later apt-get install ./connaio.deb finds its
# libraries installed. The cache is per runner image: its .debs are what apt chose on that image,
# so dpkg installs exactly what apt did then, no older versions over newer.
name: apt
description: Install Ubuntu packages, their downloads cached

inputs:
  packages:
    description: the packages, space-separated
    required: true

runs:
  using: composite
  steps:
    - id: image # ImageOS and ImageVersion are the runner's environment, not the env context
      shell: bash
      run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: apt-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ inputs.packages }}
    - name: Install ${{ inputs.packages }}
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = true ]; then
          shopt -s nullglob
          debs=(~/apt-cache/*.deb) # none when the image had them all
          [ ${#debs[@]} -eq 0 ] || sudo dpkg -i "${debs[@]}"
          exit 0
        fi
        mkdir -p ~/apt-cache/partial
        apt="sudo apt-get -o Dir::Cache::Archives=$HOME/apt-cache -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
        $apt update
        $apt install -y ${{ inputs.packages }}
        sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
        sudo chown -R "$USER" ~/apt-cache # apt wrote it as root; the cache saves it as this user
