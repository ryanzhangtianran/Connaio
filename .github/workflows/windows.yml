# Builds the Windows (10 1809+ / 11, x64) installer on windows-latest: connaio.exe, connaio-core.exe
# and wintun.dll in an NSIS installer, attached to the release of a pushed tag.
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the installer to a tag's release

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
          fetch-depth: 0 # the latest tag is the package version
      - uses: actions/checkout@v4
        with:
          repository: ryanzhangtianran/connaio-core
          ref: reverse-tunnels
          path: connaio-core
          fetch-depth: 0 # its latest tag is the mihomo version it reports
      - uses: actions/setup-go@v5
        with:
          go-version-file: Connaio/go.mod
          cache-dependency-path: |
            Connaio/go.sum
            connaio-core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wails3 and NSIS
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH" # a native path: wails3 looks makensis up through the Windows PATH
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the installer
        working-directory: Connaio
        run: wails3 task windows:package

      - name: Test against the built core
        working-directory: Connaio
        run: |
          CONNAIO_CORE=$PWD/bin/connaio-core.exe go test ./internal/profile ./internal/core ./internal/sysproxy ./internal/daemon
          go test -run Windows ./internal/app

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Connaio/bin/Connaio-*-windows-amd64.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Connaio/bin/Connaio-*-windows-amd64.exe --clobber -R "$GITHUB_REPOSITORY"
