# Builds the Windows (10 1809+ / 11, x64) installer on windows-latest: connaio.exe, connaio-core.exe
# and wintun.dll in an NSIS installer, attached to the release of a pushed tag.
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the installer to a tag's release

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
          fetch-depth: 0 # the latest tag is the package version
      - uses: ./Connaio/.github/actions/setup
      - name: Install NSIS
        # from the project's SourceForge downloads, pinned: Chocolatey's feed fails now and then and
        # exits 0 anyway
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o nsis.exe "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe"
          echo "38d49f8fe09b1c332b01d0940e57b7258f4447733643273a01c59959ad9d3b0a  nsis.exe" | sha256sum -c -
          MSYS2_ARG_CONV_EXCL='*' ./nsis.exe /S
          [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH" # a native path: wails3 looks makensis up through the Windows PATH

      - name: Build the installer
        working-directory: Connaio
        run: wails3 task windows:package

      - name: Test against the built core
        working-directory: Connaio
        run: |
          CONNAIO_CORE=$PWD/bin/connaio-core.exe go test ./internal/profile ./internal/core ./internal/sysproxy ./internal/daemon
          go test -run Windows ./internal/app

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Connaio/bin/Connaio-*-windows-amd64.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh Connaio/build/attach.sh Connaio/bin/Connaio-*-windows-amd64.exe
