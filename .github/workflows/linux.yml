# Builds the Linux (Ubuntu 22.04+, x86-64) .deb on Ubuntu 22.04, so it links against the oldest
# glibc and GTK it supports; installs and starts it there and on the newer LTS releases, and attaches
# it to the release of a pushed tag.
name: linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the .deb to a tag's release

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
          fetch-depth: 0 # the latest tag is the package version
      - name: Install GTK 3 and WebKit2GTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus
      - uses: ./Connaio/.github/actions/setup
        with:
          wails-tags: gtk3 # the CLI links the GUI stack too, GTK 4 unless told otherwise; 22.04 only has GTK 3

      - name: Build the .deb
        working-directory: Connaio
        run: wails3 task linux:package

      - name: Test against the built core
        working-directory: Connaio
        run: |
          CONNAIO_CORE=$PWD/bin/connaio-core go test -tags gtk3 ./internal/profile ./internal/core ./internal/sysproxy ./internal/daemon
          go test -tags gtk3 -run Linux ./internal/app  # the Linux readers of /proc, resolvectl and .desktop files
          go -C ../connaio-core test ./adapter/outboundgroup

      - name: Install and start it
        working-directory: Connaio
        run: |
          sudo apt-get install -y ./bin/connaio.deb
          build/linux/smoke.sh

      - name: Root core and TUN, as granting root in 通用 does
        working-directory: Connaio
        run: |
          uid=$(id -u) sock=/var/lib/connaio/$(id -u)/core.sock
          sudo /usr/lib/connaio/connaio-root enable "$uid" # what pkexec runs
          for i in $(seq 30); do curl -sf --unix-socket "$sock" http://x/version && break; sleep 1; done
          echo
          # the config the GUI pushes with enhanced mode on: TUN capture, fake-ip DNS, processes always looked up (appDefaults)
          curl -sf --unix-socket "$sock" -X PUT 'http://x/configs?force=true' -H 'Content-Type: application/json' \
            -d '{"payload":"mixed-port: 7890\nmode: rule\nfind-process-mode: always\ncapture: {mode: tun}\ndns: {enable: true, enhanced-mode: fake-ip, nameserver: [8.8.8.8]}\nrules:\n  - MATCH,DIRECT\n"}'
          sleep 3
          ip -brief link
          curl -s -o /dev/null -w "no proxy set, through TUN: %{http_code}\n" http://www.gstatic.com/generate_204
          sleep 1
          # the root core saw curl's connection, and named its process
          sudo tail -n 25 /var/lib/connaio/$uid/core.log
          sudo grep -E '\(curl[,)]' /var/lib/connaio/$uid/core.log # the destination shows as a name or an IP, depending on whether DNS went through the TUN
      - name: Turn the root core off
        if: always()
        run: sudo /usr/lib/connaio/connaio-root disable "$(id -u)" || true

      - name: Name the .deb like the other releases
        working-directory: Connaio
        run: |
          version=$(git describe --tags --abbrev=0 | sed 's/^v//')
          mv bin/connaio.deb "bin/Connaio-$version-linux-amd64.deb"
          echo "DEB=Connaio/bin/Connaio-$version-linux-amd64.deb" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: ${{ env.DEB }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$DEB" --clobber -R "$GITHUB_REPOSITORY"

      # connaio-server: the app with no window, its UI on a web port; no GUI libraries, so any Linux
      - name: Build connaio-server, amd64 and arm64
        working-directory: Connaio
        run: wails3 task linux:package:server
      - name: Start connaio-server
        working-directory: Connaio
        run: |
          d=$(mktemp -d)
          bin/server-amd64/connaio-server --listen 127.0.0.1:9090 --data-dir "$d" --token ci > "$d/out.log" 2>&1 &
          for i in $(seq 30); do curl -sf --unix-socket "$d/core.sock" http://x/version && break; sleep 1; done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/)" = 401 # nothing without the token
          curl -sf -c "$d/jar" -o /dev/null 'http://127.0.0.1:9090/?token=ci'
          curl -sf -b "$d/jar" http://127.0.0.1:9090/ | grep -q 'id="root"' # the UI, behind the cookie
          cat "$d/out.log"
          kill %1
      - name: Attach connaio-server to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: Connaio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" bin/Connaio-*-linux-*-server.tar.gz --clobber -R "$GITHUB_REPOSITORY"

  # the same .deb on the newer LTS releases: installs with their packages, starts and proxies
  install:
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: build/linux/smoke.sh
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: Install and start it
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./Connaio-*-linux-amd64.deb xvfb xauth dbus curl ca-certificates
          build/linux/smoke.sh
