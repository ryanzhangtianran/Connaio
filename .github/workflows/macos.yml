# Builds the macOS (12+, Apple silicon) .dmg on macos-latest: Connaio.app with connaio-core inside,
# signed with the Apple Development identity in the secrets (ad-hoc without), attached to the release of a pushed tag.
name: macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the .dmg to a tag's release

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
          fetch-depth: 0 # the latest tag is the package version
      - uses: ./Connaio/.github/actions/setup

      - name: Import the signing certificate
        # an Apple Development identity (.p12, base64) signs the app and its core under one team, so
        # 登录项与扩展 shows the daemon as Connaio; without the secret the build is signed ad-hoc
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pass=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build the .dmg
        working-directory: Connaio
        run: |
          wails3 task darwin:package:dmg
          version=$(git describe --tags --abbrev=0 | sed 's/^v//')
          mv bin/Connaio.dmg "bin/Connaio-$version-macos-arm64.dmg"

      - name: Test against the built core
        working-directory: Connaio
        run: CONNAIO_CORE=$PWD/bin/connaio-core go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: Connaio/bin/Connaio-*-macos-arm64.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Connaio/bin/Connaio-*-macos-arm64.dmg --clobber -R "$GITHUB_REPOSITORY"
