# Checks every push to main: the Go code vets and tests, the frontend typechecks, macOS and Windows
# build. The release workflows only run on a tag, which left a broken main unnoticed until release day.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
      - uses: ./Connaio/.github/actions/apt # GTK 3 and WebKit2GTK 4.1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus # as the Linux release: one cache for both
      - uses: ./Connaio/.github/actions/setup
        with:
          wails-tags: gtk3
      - name: Build the frontend # typechecks it; main.go embeds frontend/dist, so Go needs it built
        working-directory: Connaio
        run: |
          wails3 task common:generate:bindings
          cd frontend && npm ci && npm run build
      - name: Vet and test
        working-directory: Connaio
        run: |
          go vet -tags gtk3 ./... # Ubuntu 22.04 has GTK 3; wails links GTK 4 unless told
          go test -tags gtk3 ./internal/profile ./internal/app
          CGO_ENABLED=0 go test -tags server ./internal/app ./internal/cli # the headless build, as the release builds it: its updater and command line
      - name: Build, as the release does # the deb's app and the headless build: their objects and core for main's cache, which a tag's build restores
        working-directory: Connaio
        run: |
          wails3 task linux:build
          wails3 task linux:package:headless

  # macOS and Windows build on main too: a break shows before release day, and main keeps their Go
  # caches, which a tag's build restores (one saved on a tag serves no other tag)
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
      - uses: ./Connaio/.github/actions/setup
      - name: Build, as the release does
        working-directory: Connaio
        run: wails3 task build
