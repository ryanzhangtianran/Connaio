# Checks every push to main: the Go code vets and tests, the frontend typechecks. The release
# workflows only run on a tag, which left a broken main unnoticed until release day.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
      - uses: ./Connaio/.github/actions/apt # GTK 3 and WebKit2GTK 4.1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: ./Connaio/.github/actions/setup
        with:
          wails-tags: gtk3
      - name: Build the frontend # typechecks it; main.go embeds frontend/dist, so Go needs it built
        working-directory: Connaio
        run: |
          wails3 task common:generate:bindings
          cd frontend && npm ci && npm run build
      - name: Vet and test
        working-directory: Connaio
        run: |
          go vet -tags gtk3 ./... # Ubuntu 22.04 has GTK 3; wails links GTK 4 unless told
          go test -tags gtk3 ./internal/profile ./internal/app
