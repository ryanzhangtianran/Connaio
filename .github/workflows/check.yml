# Checks every push to main: the Go code vets and tests, the frontend typechecks. The release
# workflows only run on a tag, which left a broken main unnoticed until release day.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: Connaio
      - name: Install GTK 3 and WebKit2GTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: ./Connaio/.github/actions/setup
        with:
          wails-tags: gtk3
      - name: Vet and test
        working-directory: Connaio
        run: |
          go vet ./...
          go test ./internal/profile ./internal/app
      - name: Typecheck the frontend
        working-directory: Connaio
        run: |
          wails3 task common:generate:bindings
          cd frontend && npm ci && npx tsc --noEmit
