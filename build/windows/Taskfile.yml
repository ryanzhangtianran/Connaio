version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Wintun gives the core its TUN device on Windows; the dll ships next to connaio-core.exe.
  WINTUN_URL: https://www.wintun.net/builds/wintun-0.14.1.zip
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51 # as published on wintun.net

tasks:
  build:
    summary: Builds connaio.exe, connaio-core.exe and fetches wintun.dll into BIN_DIR (cross-compiles from anywhere, no cgo)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - task: common:build:core
        vars:
          GOOS: windows
          ARCH: '{{.ARCH | default "amd64"}}'
      - task: fetch:wintun
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X github.com/ryanzhangtianran/Connaio/internal/app.appVersion={{.VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default "amd64"}}'

  fetch:wintun:
    summary: Downloads wintun.dll into BIN_DIR, checking the zip against WINTUN_SHA256
    internal: true
    status:
      - test -f "{{.BIN_DIR}}/wintun.dll"
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - curl -sSfL -o "{{.BIN_DIR}}/wintun.zip" "{{.WINTUN_URL}}"
      - |
        got=$( (sha256sum "{{.BIN_DIR}}/wintun.zip" 2>/dev/null || shasum -a 256 "{{.BIN_DIR}}/wintun.zip") | cut -d' ' -f1)
        [ "$got" = "{{.WINTUN_SHA256}}" ] || { echo "wintun.zip sha256 $got, expected {{.WINTUN_SHA256}}"; rm -f "{{.BIN_DIR}}/wintun.zip"; exit 1; }
      # unzip on macOS and Linux; on Windows the Git Bash tar is GNU and can't read zips, but System32's bsdtar can
      - cmd: unzip -joq "{{.BIN_DIR}}/wintun.zip" "wintun/bin/{{.ARCH | default "amd64"}}/wintun.dll" -d "{{.BIN_DIR}}"
        platforms: [darwin, linux]
      - cmd: C:/Windows/System32/tar.exe -xf "{{.BIN_DIR}}/wintun.zip" -C "{{.BIN_DIR}}" --strip-components=3 "wintun/bin/{{.ARCH | default "amd64"}}/wintun.dll"
        platforms: [windows]
      - rm -f "{{.BIN_DIR}}/wintun.zip"

  generate:syso:
    summary: Generates the Windows .syso (icon, manifest, version info)
    internal: true
    dir: build
    cmds:
      - sed "s/__VERSION__/{{.VERSION}}/g" windows/info.json > windows/info.gen.json # the version is the git tag
      - wails3 generate syso -arch {{.ARCH | default "amd64"}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.gen.json -out ../wails_windows_{{.ARCH | default "amd64"}}.syso

  package:
    summary: Packages a production build as an NSIS installer, bin/Connaio-<version>-windows-amd64.exe (needs makensis)
    dir: build/windows/nsis
    deps:
      - task: build
    cmds:
      # the WebView2 bootstrapper the installer runs when the runtime is missing
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      # NSIS on Windows wants backslashes in File paths (a mixed D:\...\x/bin/y.exe finds nothing)
      - makensis -DINFO_PRODUCTVERSION={{.VERSION}} -DARG_WAILS_AMD64_BINARY="{{.BIN}}{{.APP_NAME}}.exe" -DARG_CORE_BINARY="{{.BIN}}connaio-core.exe" -DARG_WINTUN="{{.BIN}}wintun.dll" project.nsi
    vars:
      BIN: '{{if eq OS "windows"}}{{.ROOT_DIR}}\{{.BIN_DIR}}\{{else}}{{.ROOT_DIR}}/{{.BIN_DIR}}/{{end}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
