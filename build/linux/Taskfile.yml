version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds connaio and connaio-core for Linux against GTK 3 and WebKit2GTK 4.1, which Ubuntu 22.04 has
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - task: common:build:relay # embedded: before the app's build
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
      - task: common:build:core
        vars:
          GOOS: linux
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags gtk3 -buildvcs=false -gcflags=all="-l"{{else}}-tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s -X github.com/ryanzhangtianran/Connaio/internal/app.appVersion={{.VERSION}}"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages a production build as a .deb for Ubuntu 22.04 and later
    deps:
      - task: build
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out "{{.ROOT_DIR}}/{{.BIN_DIR}}"
    env:
      GOARCH: '{{.ARCH | default ARCH}}'
      VERSION: '{{.VERSION}}'

  package:headless:
    summary: Builds the headless app, no window and its UI on a web port (Wails' -tags server, no cgo), for amd64 and arm64, each packed as connaio with connaio-core and its systemd unit into Connaio-<version>-linux-<arch>.tar.gz (install.sh installs it)
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS: '-tags production'
          DEV: 'false'
    cmds:
      - task: common:build:relay # embedded: before the app's build
      - for: [amd64, arm64]
        task: headless:arch
        vars:
          ARCH: '{{.ITEM}}'

  headless:arch:
    internal: true
    vars:
      OUT: '{{.BIN_DIR}}/headless-{{.ARCH}}'
    cmds:
      - mkdir -p "{{.OUT}}"
      - GOOS=linux GOARCH={{.ARCH}} CGO_ENABLED=0 go build -tags server,production -trimpath -buildvcs=false -ldflags="-w -s -X github.com/ryanzhangtianran/Connaio/internal/app.appVersion={{.VERSION}}" -o "{{.OUT}}/connaio" .
      - task: common:build:core
        vars:
          GOOS: linux
          ARCH: '{{.ARCH}}'
          BIN_DIR: '{{.OUT}}'
      - cp build/linux/connaio.service build/linux/connaio.init "{{.OUT}}/"
      - tar -czf "{{.BIN_DIR}}/Connaio-{{.VERSION}}-linux-{{.ARCH}}.tar.gz" -C "{{.OUT}}" connaio connaio-core connaio.service connaio.init

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
