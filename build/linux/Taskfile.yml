version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds connaio and connaio-core for Linux against GTK 3 and WebKit2GTK 4.1, which Ubuntu 22.04 has
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
      - task: common:build:core
        vars:
          GOOS: linux
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags gtk3 -buildvcs=false -gcflags=all="-l"{{else}}-tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s -X github.com/ryanzhangtianran/Connaio/internal/app.appVersion={{.VERSION}}"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages a production build as a .deb for Ubuntu 22.04 and later
    deps:
      - task: build
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out "{{.ROOT_DIR}}/{{.BIN_DIR}}"
    env:
      GOARCH: '{{.ARCH | default ARCH}}'
      VERSION: '{{.VERSION}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
