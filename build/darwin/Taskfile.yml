version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds Connaio and connaio-core for macOS 12+ on Apple silicon
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - task: common:build:relay # embedded: before the app's build
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.BUNDLE_NAME}}"
      - task: common:build:core
        vars:
          GOOS: darwin
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X github.com/ryanzhangtianran/Connaio/internal/app.appVersion={{.VERSION}}"{{end}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:dmg:
    summary: Packages the application into a styled `.dmg`
    deps:
      - task: package
    cmds:
      - task: create:dmg

  create:dmg:
    summary: Creates a configurable `.dmg` from the `.app` bundle
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.BUNDLE_NAME}}" --out "{{.BIN_DIR}}"
        --background "{{.DMG_BACKGROUND}}"
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        --file-icon "{{.DMG_FILE_ICON}}"
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default "build/darwin/dmg-background.png"}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default "build/darwin/dmg-file-icon.icns"}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'

  create:app:bundle:
    summary: Creates the `.app` bundle (APP_SUFFIX .dev and PLIST Info.dev.plist for `run`) and signs it
    vars:
      APP: '{{.BIN_DIR}}/{{.BUNDLE_NAME}}{{.APP_SUFFIX}}.app'
      PLIST: '{{.PLIST | default "build/darwin/Info.plist"}}'
    cmds:
      # A reused bundle can acquire Finder metadata in synced folders. Build a
      # fresh bundle so codesign never has to replace a contaminated signature.
      - test -n "{{.BIN_DIR}}" && test -n "{{.BUNDLE_NAME}}" && rm -rf -- "{{.APP}}"
      - mkdir -p "{{.APP}}/Contents/MacOS"
      - mkdir -p "{{.APP}}/Contents/Resources"
      - cp build/darwin/icons.icns "{{.APP}}/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.APP}}/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.BUNDLE_NAME}}" "{{.APP}}/Contents/MacOS"
      - cp "{{.BIN_DIR}}/connaio-core" "{{.APP}}/Contents/MacOS"
      # the root daemon, run from the bundle (SMAppService, internal/daemon)
      - mkdir -p "{{.APP}}/Contents/Library/LaunchDaemons"
      - cp build/darwin/daemon.plist "{{.APP}}/Contents/Library/LaunchDaemons/com.ryanzhangtianran.connaio.core.plist"
      - sed "s/__VERSION__/{{.VERSION}}/g" "{{.PLIST}}" > "{{.APP}}/Contents/Info.plist" # the version is the git tag
      - task: codesign:adhoc
        vars:
          APP: '{{.APP}}'
          SIGN_IDENTITY: '{{.SIGN_IDENTITY}}'

  codesign:adhoc:
    summary: Signs the app bundle with the keychain's Apple Development identity, else ad-hoc (macOS only)
    internal: true
    cmds:
      - xattr -cr "{{.APP}}"
      # the app and its core under one team: 登录项与扩展 then lists the daemon as Connaio, with its icon
      - codesign --force --deep --sign "{{.SIGN_IDENTITY | default .KEYCHAIN_IDENTITY}}" "{{.APP}}"
      - codesign --verify --deep --strict "{{.APP}}"
    vars:
      KEYCHAIN_IDENTITY:
        sh: security find-identity -v -p codesigning | awk -F'"' '/Apple Development/ {print $2; exit}' | grep . || echo -

  run:
    summary: Bundles the last build as Connaio.dev.app, signed ad-hoc, and runs it
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - task: create:app:bundle
        vars:
          APP_SUFFIX: .dev
          PLIST: build/darwin/Info.dev.plist
          SIGN_IDENTITY: '-'
      - '"{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dev.app/Contents/MacOS/{{.BUNDLE_NAME}}"'
