version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # the platform build and generate:bindings both depend on it, as parallel deps; two `go mod tidy`
    # processes racing on go.mod can corrupt it (#4637)
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from an image; on macOS, `-iconcomposerinput appicon.icon -macassetdir darwin` also produces `Assets.car` from a `.icon` file (skipped on other platforms).
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename /dev/null -iconcomposerinput appicon.icon -macassetdir darwin

  build:core:
    summary: Builds connaio-core for GOOS (and ARCH) from CORE_DIR into BIN_DIR
    cmds:
      # the core reports constant.Version, a 1.10.0 placeholder unless set here, as mihomo's Makefile does;
      # on macOS with its commit, e.g. 1.19.32+07bcb6bc: the app restarts the root daemon, which runs the
      # core in the bundle, when this differs from the running one's
      # CONNAIO_CORE_CACHE (CI): a core built from this commit, for this target and version, is copied
      # from there rather than built again, and one built here is kept there
      - |
        out="{{.ROOT_DIR}}/{{.BIN_DIR}}/connaio-core{{if eq .GOOS "windows"}}.exe{{end}}"
        kept="${CONNAIO_CORE_CACHE:-}/core-{{.CORE_COMMIT}}-{{.GOOS}}-{{.ARCH | default ARCH}}-{{.CORE_VERSION}}"
        if [ -n "${CONNAIO_CORE_CACHE:-}" ] && [ -f "$kept" ]; then mkdir -p "$(dirname "$out")" && cp "$kept" "$out"; exit 0; fi
        go -C "{{.CORE_DIR}}" build -tags with_gvisor -trimpath -ldflags="-w -s -X github.com/metacubex/mihomo/constant.Version={{.CORE_VERSION}}{{if eq .GOOS "darwin"}}+{{.CORE_COMMIT}}{{end}}" -o "$out" .
        if [ -n "${CONNAIO_CORE_CACHE:-}" ]; then mkdir -p "${CONNAIO_CORE_CACHE}" && cp "$out" "$kept"; fi
    vars:
      CORE_COMMIT:
        sh: git -C "{{.CORE_DIR}}" rev-parse --short=8 HEAD
    env:
      CGO_ENABLED: 0
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:relay:
    summary: Builds connaio-relay, the server's end of a reverse tunnel, for Linux amd64 and arm64 from CORE_DIR, gzipped into internal/app/relay, which the app embeds
    # -buildvcs=false: its version is its sha256, which a core commit outside the relay mustn't change
    cmds:
      - for: [amd64, arm64]
        # gzip in Go: Windows hosts have no gzip; GOOS only on the build, so go run's helper runs here
        # CONNAIO_CORE_CACHE (CI) keeps it by the core's commit, as build:core does the core
        cmd: |
          out="{{.ROOT_DIR}}/internal/app/relay/connaio-relay-linux-{{.ITEM}}.gz"
          kept="${CONNAIO_CORE_CACHE:-}/relay-{{.CORE_COMMIT}}-{{.ITEM}}.gz"
          if [ -n "${CONNAIO_CORE_CACHE:-}" ] && [ -f "$kept" ]; then cp "$kept" "$out"; exit 0; fi
          GOOS=linux GOARCH={{.ITEM}} go -C "{{.CORE_DIR}}" build -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.ROOT_DIR}}/internal/app/relay/connaio-relay-linux-{{.ITEM}}" ./cmd/connaio-relay && go run "{{.ROOT_DIR}}/build/gzip.go" "{{.ROOT_DIR}}/internal/app/relay/connaio-relay-linux-{{.ITEM}}"
          if [ -n "${CONNAIO_CORE_CACHE:-}" ]; then mkdir -p "${CONNAIO_CORE_CACHE}" && cp "$out" "$kept"; fi
    vars:
      CORE_COMMIT:
        sh: git -C "{{.CORE_DIR}}" rev-parse --short=8 HEAD
    env:
      CGO_ENABLED: 0

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
